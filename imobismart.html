<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ImobiSmart – Imobiliária São Jorge</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #f7f5f2;
      --fg:       #1a1f2e;
      --card:     #ffffff;
      --primary:  #1c3557;
      --accent:   #b8802a;
      --muted:    #e8e4de;
      --muted-fg: #7a7060;
      --border:   rgba(26,31,46,0.10);
      --radius:   10px;
    }

    body { font-family:'Outfit',sans-serif; background:var(--bg); color:var(--fg); min-height:100vh; font-size:14px; }

    ::-webkit-scrollbar { width:5px; height:5px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:rgba(0,0,0,.15); border-radius:4px; }

    .serif { font-family:'Fraunces',serif; }
    .hidden { display:none !important; }
    .truncate { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }

    /* ── Login ── */
    #login-screen { display:flex; min-height:100vh; }
    .login-hero { flex:0 0 52%; position:relative; display:flex; flex-direction:column; background:#0f2033; }
    .login-hero img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .login-hero-overlay { position:absolute; inset:0; background:linear-gradient(135deg,rgba(15,32,51,.92) 0%,rgba(28,53,87,.72) 60%,rgba(28,53,87,.18) 100%); }
    .login-hero-content { position:relative; z-index:1; display:flex; flex-direction:column; justify-content:space-between; height:100%; padding:48px; }
    .brand { display:flex; align-items:center; gap:12px; }
    .brand-icon { width:40px; height:40px; background:var(--accent); border-radius:12px; display:flex; align-items:center; justify-content:center; }
    .brand-icon svg { width:20px; height:20px; color:#fff; fill:none; stroke:#fff; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .brand-name { color:#fff; font-size:20px; font-family:'Fraunces',serif; font-weight:600; line-height:1; }
    .brand-sub  { color:rgba(255,255,255,.45); font-size:11px; margin-top:3px; }
    .hero-pill { display:inline-flex; align-items:center; gap:8px; background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.20); border-radius:999px; padding:6px 14px; color:rgba(255,255,255,.70); font-size:11px; margin-bottom:16px; }
    .hero-pill-dot { width:7px; height:7px; border-radius:50%; background:var(--accent); animation:pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.4} }
    .hero-headline { color:#fff; font-size:2.1rem; font-family:'Fraunces',serif; font-weight:600; line-height:1.15; margin-bottom:16px; }
    .hero-sub { color:rgba(255,255,255,.60); font-size:14px; line-height:1.6; margin-bottom:24px; }
    .hero-stats { display:flex; gap:32px; }
    .hero-stat-n { color:#fff; font-size:24px; font-family:'Fraunces',serif; font-weight:700; }
    .hero-stat-l { color:rgba(255,255,255,.50); font-size:11px; }
    .login-form-wrap { flex:1; display:flex; align-items:center; justify-content:center; padding:48px 32px; }
    .login-form { width:100%; max-width:420px; }
    .login-title { font-size:1.75rem; font-family:'Fraunces',serif; font-weight:600; margin-bottom:4px; }
    .login-sub   { color:var(--muted-fg); font-size:13px; margin-bottom:32px; }
    .field-label { display:block; font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; margin-bottom:6px; color:var(--fg); }
    input[type=email], input[type=password] { width:100%; padding:12px 16px; border:1px solid var(--border); border-radius:8px; background:#fff; font-family:'Outfit',sans-serif; font-size:13px; color:var(--fg); outline:none; transition:border-color .2s, box-shadow .2s; }
    input[type=email]:focus, input[type=password]:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(28,53,87,.10); }
    .role-grid { display:grid; grid-template-columns:1fr; gap:8px; margin-bottom:4px; }
    .role-card { display:flex; align-items:center; gap:12px; padding:12px 16px; border:1px solid var(--border); border-radius:12px; background:#fff; cursor:pointer; text-align:left; transition:border-color .2s, background .2s; }
    .role-card:hover { border-color:rgba(28,53,87,.35); }
    .role-card.active { background:var(--primary); border-color:var(--primary); }
    .role-icon { width:32px; height:32px; border-radius:8px; background:var(--muted); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .role-card.active .role-icon { background:rgba(255,255,255,.15); }
    .role-icon svg { width:16px; height:16px; stroke:var(--muted-fg); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .role-card.active .role-icon svg { stroke:#fff; }
    .role-name { font-size:13px; font-weight:600; color:var(--fg); line-height:1.2; }
    .role-card.active .role-name { color:#fff; }
    .role-desc { font-size:11px; color:var(--muted-fg); }
    .role-card.active .role-desc { color:rgba(255,255,255,.60); }
    .role-check { margin-left:auto; width:16px; height:16px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; flex-shrink:0; opacity:0; transition:opacity .2s; }
    .role-card.active .role-check { opacity:1; }
    .role-check svg { width:10px; height:10px; stroke:#fff; fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
    .form-row { margin-bottom:16px; }
    .form-footer { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; font-size:12px; }
    .form-footer label { display:flex; align-items:center; gap:6px; cursor:pointer; color:var(--muted-fg); }
    .form-footer a { color:var(--accent); text-decoration:none; font-weight:500; }
    .form-footer a:hover { text-decoration:underline; }
    .btn-primary { width:100%; padding:13px; background:var(--primary); color:#fff; border:none; border-radius:8px; font-family:'Outfit',sans-serif; font-size:14px; font-weight:600; cursor:pointer; transition:background .2s, transform .1s; box-shadow:0 1px 4px rgba(28,53,87,.20); }
    .btn-primary:hover { background:#162d4a; }
    .btn-primary:active { transform:scale(.99); }
    .btn-accent { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; background:var(--accent); color:#fff; border:none; border-radius:8px; font-family:'Outfit',sans-serif; font-size:12px; font-weight:600; cursor:pointer; transition:background .2s; white-space:nowrap; }
    .btn-accent:hover { background:#a37226; }
    .btn-ghost { display:inline-flex; align-items:center; gap:4px; padding:8px 16px; background:#fff; color:var(--fg); border:1px solid var(--border); border-radius:8px; font-family:'Outfit',sans-serif; font-size:13px; font-weight:500; cursor:pointer; transition:border-color .2s; }
    .btn-ghost:hover { border-color:rgba(28,53,87,.35); }
    .btn-danger { display:inline-flex; align-items:center; gap:4px; padding:8px 16px; background:#dc2626; color:#fff; border:1px solid #dc2626; border-radius:8px; font-family:'Outfit',sans-serif; font-size:13px; font-weight:600; cursor:pointer; transition:background .2s; }
    .btn-danger:hover { background:#b91c1c; }
    .btn-icon { width:28px; height:28px; border:none; background:transparent; border-radius:7px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; transition:background .15s; padding:0; }
    .btn-icon:hover { background:var(--muted); }
    .btn-icon svg { width:14px; height:14px; stroke:var(--muted-fg); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .btn-icon.danger:hover { background:#fee2e2; }
    .btn-icon.danger svg { stroke:#f87171; }

    /* ── App Shell ── */
    #app-shell { display:flex; height:100vh; overflow:hidden; }
    #sidebar { width:224px; flex-shrink:0; background:var(--primary); display:flex; flex-direction:column; height:100%; }
    .sb-logo { padding:20px; border-bottom:1px solid rgba(255,255,255,.10); display:flex; align-items:center; gap:10px; }
    .sb-logo-icon { width:32px; height:32px; background:var(--accent); border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .sb-logo-icon svg { width:16px; height:16px; stroke:#fff; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .sb-logo-name { color:#fff; font-size:15px; font-family:'Fraunces',serif; font-weight:600; line-height:1.1; }
    .sb-logo-sub  { color:rgba(255,255,255,.40); font-size:10px; }
    .sb-role-chip { margin:12px 12px 4px; background:rgba(255,255,255,.08); border-radius:8px; padding:8px 12px; display:flex; align-items:center; gap:8px; }
    .sb-role-chip svg { width:14px; height:14px; stroke:var(--accent); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
    .sb-role-chip span { color:rgba(255,255,255,.60); font-size:11px; }
    .sb-nav { flex:1; padding:8px 12px; display:flex; flex-direction:column; gap:2px; overflow-y:auto; }
    .nav-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; cursor:pointer; border:none; background:transparent; color:rgba(255,255,255,.55); font-family:'Outfit',sans-serif; font-size:12px; width:100%; text-align:left; transition:background .15s, color .15s; }
    .nav-item:hover { background:rgba(255,255,255,.08); color:rgba(255,255,255,.85); }
    .nav-item.active { background:rgba(255,255,255,.15); color:#fff; font-weight:500; }
    .nav-item svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
    .nav-dot { width:6px; height:6px; border-radius:50%; background:var(--accent); margin-left:auto; flex-shrink:0; }
    .sb-user { padding:12px; border-top:1px solid rgba(255,255,255,.10); }
    .sb-user-row { display:flex; align-items:center; gap:10px; padding:4px 8px 10px; }
    .sb-avatar { width:28px; height:28px; border-radius:50%; background:rgba(184,128,42,.25); border:1px solid rgba(184,128,42,.40); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:10px; font-weight:700; color:#e0a44a; }
    .sb-user-name { color:#fff; font-size:11px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .btn-logout { display:flex; align-items:center; gap:8px; width:100%; padding:8px 12px; border:none; border-radius:8px; background:transparent; cursor:pointer; color:rgba(255,255,255,.45); font-family:'Outfit',sans-serif; font-size:12px; transition:background .15s, color .15s; }
    .btn-logout:hover { background:rgba(255,255,255,.08); color:rgba(255,255,255,.75); }
    .btn-logout svg { width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

    /* ── Main ── */
    #main { flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0; }
    #header { height:56px; background:#fff; border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 24px; gap:16px; flex-shrink:0; }
    #header-title { font-family:'Fraunces',serif; font-size:15px; font-weight:600; white-space:nowrap; }
    .header-search { flex:1; max-width:280px; position:relative; margin-left:8px; }
    .header-search input { padding:6px 12px 6px 32px; border-radius:8px; background:rgba(232,228,222,.6); border:1px solid var(--border); font-size:12px; width:100%; font-family:'Outfit',sans-serif; outline:none; transition:border-color .2s; }
    .header-search input:focus { border-color:rgba(28,53,87,.3); background:#fff; }
    .header-search svg { position:absolute; left:10px; top:50%; transform:translateY(-50%); width:14px; height:14px; stroke:var(--muted-fg); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .header-right { margin-left:auto; display:flex; align-items:center; gap:8px; }
    .notif-btn { position:relative; width:32px; height:32px; border:none; background:transparent; border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .15s; }
    .notif-btn:hover { background:var(--muted); }
    .notif-btn svg { width:16px; height:16px; stroke:var(--muted-fg); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .notif-dot { position:absolute; top:6px; right:6px; width:6px; height:6px; border-radius:50%; background:var(--accent); }
    .header-avatar { width:28px; height:28px; border-radius:50%; background:var(--primary); display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:#fff; }
    #content { flex:1; overflow-y:auto; padding:24px; }

    /* ── KPI ── */
    .kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; margin-bottom:20px; }
    .kpi-card { background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:20px; display:flex; flex-direction:column; gap:12px; }
    .kpi-card.gold { border-color:rgba(184,128,42,.25); }
    .kpi-top { display:flex; align-items:flex-start; justify-content:space-between; }
    .kpi-label { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--muted-fg); }
    .kpi-icon { width:32px; height:32px; border-radius:8px; background:var(--muted); display:flex; align-items:center; justify-content:center; }
    .kpi-icon.gold { background:rgba(184,128,42,.12); }
    .kpi-icon svg { width:16px; height:16px; stroke:rgba(26,31,46,.60); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .kpi-icon.gold svg { stroke:var(--accent); }
    .kpi-value { font-size:24px; font-family:'Fraunces',serif; font-weight:700; color:var(--fg); }
    .kpi-sub { font-size:11px; color:#16a34a; font-weight:500; margin-top:2px; }

    /* ── Charts ── */
    .chart-grid { display:grid; grid-template-columns:2fr 1fr; gap:16px; margin-bottom:20px; }
    .chart-card { background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:20px; }
    .chart-card h3 { font-family:'Fraunces',serif; font-size:14px; font-weight:600; margin-bottom:2px; }
    .chart-card p  { font-size:11px; color:var(--muted-fg); margin-bottom:16px; }
    .chart-legend { display:flex; gap:20px; margin-top:12px; }
    .legend-item { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted-fg); }
    .legend-dot { width:12px; height:12px; border-radius:3px; flex-shrink:0; }
    .pie-legend { margin-top:8px; display:flex; flex-direction:column; gap:8px; }
    .pie-legend-item { display:flex; align-items:center; justify-content:space-between; }
    .pie-legend-left { display:flex; align-items:center; gap:8px; font-size:11px; color:var(--muted-fg); }
    .pie-legend-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
    .pie-legend-val { font-size:11px; font-weight:600; color:var(--fg); }

    /* ── Table ── */
    .table-card { background:#fff; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
    .table-header { display:flex; align-items:center; justify-content:space-between; padding:14px 20px; border-bottom:1px solid var(--border); }
    .table-header h3 { font-family:'Fraunces',serif; font-size:14px; font-weight:600; }
    .table-header span { font-size:11px; color:var(--muted-fg); }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    thead tr { border-bottom:1px solid var(--border); background:rgba(232,228,222,.40); }
    thead th { padding:10px 16px; text-align:left; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted-fg); white-space:nowrap; }
    tbody tr { border-bottom:1px solid var(--border); transition:background .12s; }
    tbody tr:last-child { border-bottom:none; }
    tbody tr:hover { background:rgba(232,228,222,.25); }
    tbody td { padding:13px 16px; vertical-align:middle; }
    .client-cell { display:flex; align-items:center; gap:10px; }
    .client-avatar { width:32px; height:32px; border-radius:50%; background:rgba(28,53,87,.10); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:12px; font-weight:700; color:var(--primary); }
    .client-name { font-weight:500; color:var(--fg); line-height:1.2; }
    .client-email { font-size:11px; color:var(--muted-fg); }
    .text-muted { color:var(--muted-fg); }
    .text-primary-bold { font-family:'Fraunces',serif; font-weight:700; color:var(--primary); }
    .td-actions { display:flex; gap:2px; justify-content:flex-end; }
    .empty-row td { padding:48px; text-align:center; color:var(--muted-fg); }

    /* ── Badges ── */
    .badge { display:inline-flex; align-items:center; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:500; border:1px solid; white-space:nowrap; }
    .badge-green  { background:#f0fdf4; color:#15803d; border-color:#bbf7d0; }
    .badge-amber  { background:#fffbeb; color:#b45309; border-color:#fde68a; }
    .badge-blue   { background:#eff6ff; color:#1d4ed8; border-color:#bfdbfe; }
    .badge-violet { background:#f5f3ff; color:#6d28d9; border-color:#ddd6fe; }
    .badge-red    { background:#fef2f2; color:#b91c1c; border-color:#fecaca; }
    .badge-sky    { background:#f0f9ff; color:#0369a1; border-color:#bae6fd; }
    .badge-gray   { background:#f9fafb; color:#6b7280; border-color:#e5e7eb; }

    /* ── Filter bar ── */
    .filter-bar { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
    .filter-pills { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .pill { padding:6px 12px; border-radius:8px; font-size:11px; font-weight:500; border:1px solid var(--border); background:#fff; color:var(--fg); cursor:pointer; transition:all .15s; }
    .pill:hover { border-color:rgba(28,53,87,.35); }
    .pill.active { background:var(--primary); color:#fff; border-color:var(--primary); }

    /* ── Imóveis grid ── */
    .imoveis-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; }
    .imovel-card { background:#fff; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; transition:box-shadow .25s; }
    .imovel-card:hover { box-shadow:0 8px 24px rgba(0,0,0,.10); }
    .imovel-img { position:relative; height:176px; background:var(--muted); overflow:hidden; }
    .imovel-img img { width:100%; height:100%; object-fit:cover; transition:transform .5s; }
    .imovel-card:hover .imovel-img img { transform:scale(1.05); }
    .imovel-badges { position:absolute; top:12px; left:12px; }
    .imovel-tipo  { position:absolute; top:12px; right:12px; }
    .tipo-venda   { background:var(--primary); color:#fff; }
    .tipo-aluguel { background:var(--accent);  color:#fff; }
    .imovel-body { padding:16px; }
    .imovel-title { font-family:'Fraunces',serif; font-size:14px; font-weight:600; margin-bottom:4px; line-height:1.3; }
    .imovel-loc { display:flex; align-items:center; gap:4px; font-size:11px; color:var(--muted-fg); margin-bottom:10px; }
    .imovel-loc svg { width:12px; height:12px; stroke:var(--muted-fg); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
    .imovel-specs { display:flex; align-items:center; gap:14px; font-size:11px; color:var(--muted-fg); margin-bottom:12px; }
    .imovel-spec { display:flex; align-items:center; gap:3px; }
    .imovel-spec svg { width:12px; height:12px; stroke:var(--muted-fg); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .imovel-footer { display:flex; align-items:center; justify-content:space-between; }
    .imovel-price { font-family:'Fraunces',serif; font-size:16px; font-weight:700; color:var(--primary); }
    .imovel-actions { display:flex; gap:2px; }

    /* ── Atendimentos ── */
    .atend-list { display:flex; flex-direction:column; gap:8px; }
    .atend-card { background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:16px; display:flex; align-items:flex-start; gap:14px; transition:box-shadow .2s; }
    .atend-card:hover { box-shadow:0 2px 8px rgba(0,0,0,.06); }
    .atend-icon { flex-shrink:0; margin-top:2px; }
    .atend-icon svg { width:16px; height:16px; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .atend-body { flex:1; min-width:0; }
    .atend-title { font-size:14px; font-weight:600; font-family:'Fraunces',serif; margin-bottom:2px; }
    .atend-title span { font-weight:400; color:var(--muted-fg); font-family:'Outfit',sans-serif; }
    .atend-sub { font-size:11px; color:var(--muted-fg); margin-bottom:4px; }
    .atend-obs { font-size:11px; color:rgba(122,112,96,.75); font-style:italic; }
    .atend-meta { flex-shrink:0; text-align:right; font-size:11px; color:var(--muted-fg); }
    .atend-meta .date { font-weight:500; color:var(--fg); margin-bottom:2px; }

    /* ── Banners ── */

function fmtPreco(val, tipo) {
  return tipo === "Aluguel"
    ? `R$ ${val.toLocaleString("pt-BR")}/mês`

}

function toISODate(ddmmyyyy) {
  if (!ddmmyyyy || !ddmmyyyy.includes('/')) return '';
  const [d,m,y] = ddmmyyyy.split('/');
  return `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
}
function toBRDate(yyyymmdd) {
  if (!yyyymmdd || !yyyymmdd.includes('-')) return yyyymmdd || '';
  const [y,m,d] = yyyymmdd.split('-');
  return `${d}/${m}/${y}`;
}

const TOAST_ICONS = {
  success:`<svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:#16a34a;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><polyline points="20 6 9 17 4 12"/></svg>`,
  error:`<svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:#dc2626;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`,
  info:`<svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:#2563eb;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
  default:`<svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:#7a7060;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><circle cx="12" cy="12" r="10"/></svg>`,
};
function showToast(msg, type='success') {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.innerHTML = `${TOAST_ICONS[type]||''}${msg}`;
  container.appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .3s, transform .3s';
    el.style.opacity = '0';
    el.style.transform = 'translateX(16px)';
    setTimeout(() => el.remove(), 300);
  }, 3000);
}

  document.getElementById('confirm-msg').textContent = msg;

═══════════════════════════════════════════════════════ */
let charts = {};
function destroyChart(id) { if(charts[id]){ charts[id].destroy(); delete charts[id]; } }

function initCharts() {
  setTimeout(() => {
    const role = state.role;
    const barEl = document.getElementById('barChart');
    if (barEl) {
      destroyChart('bar');
      let data, labels, ds1, ds2, l1, l2;
      if(role==='Administrador'){data=DATA.negMensal;labels=data.map(d=>d.mes);ds1=data.map(d=>d.fechadas);ds2=data.map(d=>d.andamento);l1='Fechadas';l2='Em andamento';}
      else if(role==='Corretor'){data=DATA.corretorStats;labels=data.map(d=>d.mes);ds1=data.map(d=>d.atend);ds2=data.map(d=>d.neg);l1='Atendimentos';l2='Negociações';}
      else{data=DATA.funcStats;labels=data.map(d=>d.mes);ds1=data.map(d=>d.cadastros);ds2=data.map(d=>d.atend);l1='Cadastros';l2='Atendimentos';}
      charts['bar'] = new Chart(barEl, {
        type:'bar',
        data:{labels,datasets:[
          {label:l1,data:ds1,backgroundColor:'#1c3557',borderRadius:4},
          {label:l2,data:ds2,backgroundColor:'#b8802a',borderRadius:4},
        ]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${ctx.dataset.label}: ${ctx.parsed.y}`}}},scales:{x:{grid:{display:false},ticks:{font:{family:'Outfit',size:11},color:'#9ca3af'}},y:{grid:{color:'rgba(0,0,0,.05)'},ticks:{font:{family:'Outfit',size:11},color:'#9ca3af'}}}}
      });
    }
    const pieEl = document.getElementById('pieChart');
    if (pieEl) {
      destroyChart('pie');
      charts['pie'] = new Chart(pieEl, {
        type:'doughnut',
        data:{labels:DATA.statusPie.map(d=>d.name),datasets:[{data:DATA.statusPie.map(d=>d.value),backgroundColor:DATA.statusPie.map(d=>d.color),borderWidth:2,borderColor:'#fff',hoverOffset:4}]},
        options:{responsive:true,maintainAspectRatio:false,cutout:'58%',plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${ctx.label}: ${ctx.parsed}`}}}}
      });
    }
  }, 60);
}

        </div>
        <div class="imovel-footer">
          <div class="imovel-price serif">${fmtPreco(im.preco,im.tipo)}</div>
          <div class="imovel-actions">

function addImovelForm() {
  _editing = {type:'imovel', id:null};
  openModal({title:'Cadastrar Imóvel', body:_imovelFormHTML(null),
    footer:`<button class="btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn-accent" onclick="saveImovel()">Cadastrar</button>`});
}

function editImovelForm(id) {
  const im = DATA.imoveis.find(i=>i.id===id); if(!im) return;
  _editing = {type:'imovel', id};
  openModal({title:'Editar Imóvel', sub:`${im.bairro}, ${im.cidade}`, body:_imovelFormHTML(im),
    footer:`<button class="btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn-accent" onclick="saveImovel()">Salvar alterações</button>`});
}

function saveImovel() {
  const titulo = document.getElementById('f-titulo')?.value?.trim();
  if(!titulo){ showToast('O título é obrigatório.','error'); return; }
  const data = {
    titulo,
    tipo:      document.getElementById('f-tipo').value,
    status:    document.getElementById('f-status').value,
    bairro:    document.getElementById('f-bairro').value.trim(),
    cidade:    document.getElementById('f-cidade').value,
    preco:    +document.getElementById('f-preco').value||0,
    area:     +document.getElementById('f-area').value||0,
    quartos:  +document.getElementById('f-quartos').value||0,
    banheiros:+document.getElementById('f-banheiros').value||0,
    vagas:    +document.getElementById('f-vagas').value||0,
    foto:      document.getElementById('f-foto').value.trim(),
  };
  if(_editing?.id) {
    const idx = DATA.imoveis.findIndex(i=>i.id===_editing.id);
    if(idx>=0) DATA.imoveis[idx] = {...DATA.imoveis[idx],...data};
    showToast('Imóvel atualizado com sucesso!');
  } else {
    DATA.imoveis.push({id:++_nextId,...data});
    showToast('Imóvel cadastrado!');
  }
  closeModal(); renderSection();
}

function confirmDeleteImovel(id) {
  openConfirm('Deseja excluir este imóvel? Esta ação não pode ser desfeita.', () => {
    DATA.imoveis = DATA.imoveis.filter(i=>i.id!==id);
    showToast('Imóvel excluído.','default'); renderSection();
  });
}

/* ═══════════════════════════════════════════════════════
   CLIENTES
═══════════════════════════════════════════════════════ */
function renderClientes() {
  const can = CAN[state.role];
  if(!can.allClients && state.role!=='Corretor') return renderAccessDenied();
  const source = state.role==='Corretor' ? DATA.clientes.filter(c=>c.corretor==='Carlos Lima') : DATA.clientes;
  const q = (state.filter.clientesQ||'').toLowerCase();
  const tf = state.filter.clientesTipo||'Todos';
  const tipos = ['Todos','Compradora','Comprador','Locatário','Investidor'];
  const list = source.filter(c => {
    const mQ = !q || c.nome.toLowerCase().includes(q) || c.email.toLowerCase().includes(q) || (c.tel||'').includes(q);
    const mT = tf==='Todos' || c.tipo===tf;
    return mQ && mT;
  });

  const banner = state.role==='Corretor'
    ? `<div class="banner-blue"><svg viewBox="0 0 24 24">${ICONS.lock}</svg>Você visualiza apenas os clientes vinculados a você.</div>` : '';

  const pills = tipos.map(t=>`<button class="pill${tf===t?' active':''}" onclick="setFilter('clientesTipo','${t}')">${t}</button>`).join('');

  const addBtn = can.add
    ? `<button class="btn-accent" onclick="addClienteForm()"><svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round">${ICONS.plus}</svg>Novo cliente</button>`
    : `<span style="display:inline-flex;align-items:center;gap:6px;padding:7px 12px;font-size:12px;color:var(--muted-fg);border:1px solid var(--border);border-radius:8px;background:rgba(232,228,222,.4)"><svg viewBox="0 0 24 24" style="width:12px;height:12px;stroke:var(--muted-fg);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round">${ICONS.lock}</svg>Somente visualização</span>`;

  const rows = list.map(c=>`
    <tr>
      <td>
        <div class="client-cell">
          <div class="client-avatar">${c.nome.charAt(0)}</div>
          <div><div class="client-name">${esc(c.nome)}</div><div class="client-email">${esc(c.email)}</div></div>
        </div>
      </td>
      <td class="text-muted">${esc(c.tipo)}</td>
      <td class="text-muted" style="max-width:160px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${esc(c.interesse)}</td>
      <td class="text-muted">${esc(c.corretor)}</td>
      <td>${badge(c.status)}</td>
      <td>
        <div class="td-actions">
          <button class="btn-icon" onclick="viewCliente(${c.id})" title="Ver"><svg viewBox="0 0 24 24">${ICONS.eye}</svg></button>
          ${can.edit?`<button class="btn-icon" onclick="editClienteForm(${c.id})" title="Editar"><svg viewBox="0 0 24 24">${ICONS.edit}</svg></button>`:''}
          ${can.del?`<button class="btn-icon danger" onclick="confirmDeleteCliente(${c.id})" title="Excluir"><svg viewBox="0 0 24 24">${ICONS.trash}</svg></button>`:''}
        </div>
      </td>
    </tr>`).join('') || `<tr class="empty-row"><td colspan="6">Nenhum cliente encontrado.</td></tr>`;

  return `
  ${banner}
  <div class="filter-bar">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24">${ICONS.search}</svg>
        <input type="text" placeholder="Buscar cliente…" value="${esc(state.filter.clientesQ||'')}" oninput="setFilterQ('clientesQ',this.value)" style="padding:7px 12px 7px 34px;border-radius:8px;border:1px solid var(--border);font-size:12px;width:240px;font-family:'Outfit',sans-serif;outline:none;transition:border-color .2s" />
      </div>
      <div class="filter-pills">${pills}</div>
    </div>
    ${addBtn}
  </div>
  <div class="table-card">
    <table>
      <thead><tr><th>Cliente</th><th>Tipo</th><th>Interesse</th><th>Corretor</th><th>Status</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function editClienteForm(id) {
  const c = DATA.clientes.find(x=>x.id===id); if(!c) return;
  _editing = {type:'cliente', id};
  openModal({title:'Editar Cliente', body:_clienteFormHTML(c),
    footer:`<button class="btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn-accent" onclick="saveCliente()">Salvar alterações</button>`});

function saveCliente() {
  const nome = document.getElementById('f-nome')?.value?.trim();
  if(!nome){ showToast('O nome é obrigatório.','error'); return; }
  const data = {
    nome,
    email:    document.getElementById('f-email').value.trim(),
    tel:      document.getElementById('f-tel').value.trim(),
    tipo:     document.getElementById('f-tipo').value,
    status:   document.getElementById('f-status').value,
    interesse:document.getElementById('f-interesse').value.trim(),
    corretor: document.getElementById('f-corretor').value,
  };
  if(_editing?.id) {
    const idx = DATA.clientes.findIndex(c=>c.id===_editing.id);
    if(idx>=0) DATA.clientes[idx] = {...DATA.clientes[idx],...data};
    showToast('Cliente atualizado!');
  } else {
    DATA.clientes.push({id:++_nextId, cadastro:new Date().toLocaleDateString('pt-BR'), ...data});
    showToast('Cliente cadastrado!');

  closeModal(); renderSection();
}

function confirmDeleteCliente(id) {

  });
}

/* ═══════════════════════════════════════════════════════
   ATENDIMENTOS
═══════════════════════════════════════════════════════ */
function renderAtendimentos() {
  const can = CAN[state.role];
  const f = state.filter.atend || 'Todos';
  const filters = ['Todos','Agendado','Realizado','Cancelado'];
  const source = state.role==='Corretor' ? DATA.atendimentos.filter(a=>a.corretor==='Carlos Lima') : DATA.atendimentos;
  const list = f==='Todos' ? source : source.filter(a=>a.status===f);

  const banner = state.role==='Corretor'
    ? `<div class="banner-blue"><svg viewBox="0 0 24 24">${ICONS.lock}</svg>Você visualiza apenas os atendimentos atribuídos a você.</div>` : '';

  const addBtn = can.add
    ? `<button class="btn-accent" onclick="addAtendForm()"><svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round">${ICONS.plus}</svg>Novo atendimento</button>`
    : `<span style="display:inline-flex;align-items:center;gap:6px;padding:7px 12px;font-size:12px;color:var(--muted-fg);border:1px solid var(--border);border-radius:8px;background:rgba(232,228,222,.4)"><svg viewBox="0 0 24 24" style="width:12px;height:12px;stroke:var(--muted-fg);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round">${ICONS.lock}</svg>Somente visualização</span>`;

  const pills = filters.map(p=>`<button class="pill${f===p?' active':''}" onclick="setFilter('atend','${p}')">${p}</button>`).join('');

  const items = list.map(a => {
    let svg, color;
    if(a.status==='Realizado'){svg=ICONS.check;color='#16a34a';}
    else if(a.status==='Agendado'){svg=ICONS.clock;color='#2563eb';}
    else{svg=ICONS.x;color='#f87171';}
    return `
    <div class="atend-card" style="cursor:pointer" onclick="viewAtendimento(${a.id})">
      <div class="atend-icon"><svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:${color};fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round">${svg}</svg></div>
      <div class="atend-body">
        <div class="atend-title serif">${esc(a.cliente)} <span>· ${esc(a.tipo)}</span></div>
        <div class="atend-sub">${esc(a.imovel)} · <span style="color:rgba(28,53,87,.70)">${esc(a.corretor)}</span></div>
        ${a.obs?`<div class="atend-obs">"${esc(a.obs)}"</div>`:''}
      </div>
      <div class="atend-meta">
        <div class="date">${a.data}</div><div>${a.horario}</div>
        <div style="margin-top:4px">${badge(a.status)}</div>
        <div style="display:flex;gap:2px;justify-content:flex-end;margin-top:6px" onclick="event.stopPropagation()">
          ${can.edit?`<button class="btn-icon" onclick="editAtendForm(${a.id})" title="Editar"><svg viewBox="0 0 24 24">${ICONS.edit}</svg></button>`:''}
          ${can.del?`<button class="btn-icon danger" onclick="confirmDeleteAtend(${a.id})" title="Excluir"><svg viewBox="0 0 24 24">${ICONS.trash}</svg></button>`:''}
        </div>
      </div>
    </div>`;
  }).join('') || `<div style="padding:48px;text-align:center;color:var(--muted-fg)">Nenhum atendimento encontrado.</div>`;

  return `
  ${banner}
  <div class="filter-bar">
    <div class="filter-pills">${pills}</div>
    ${addBtn}
  </div>
  <div class="atend-list">${items}</div>`;
}

/* ── Atendimento CRUD ── */
function viewAtendimento(id) {
  const a = DATA.atendimentos.find(x=>x.id===id); if(!a) return;
  const can = CAN[state.role];
  const body = `

function saveAtend() {
  const cliente = document.getElementById('f-cliente')?.value;
  if(!cliente){ showToast('Selecione o cliente.','error'); return; }
  const dataRaw = document.getElementById('f-data').value;
  const data = {

function renderNegociacoes() {
  const can = CAN[state.role];
  if(!can.allNeg && state.role!=='Corretor') return renderAccessDenied();
  const f = state.filter.neg || 'Todos';
  const filters = ['Todos','Em Proposta','Em Análise','Contrato','Fechada','Cancelada'];
  const source = state.role==='Corretor' ? DATA.negociacoes.filter(n=>n.corretor==='Carlos Lima') : DATA.negociacoes;
  const list = f==='Todos' ? source : source.filter(n=>n.etapa===f);

  const banner = state.role==='Corretor'
    ? `<div class="banner-blue"><svg viewBox="0 0 24 24">${ICONS.lock}</svg>Você visualiza apenas as negociações em que é responsável. Valores globais não são exibidos.</div>` : '';

  const addBtn = can.add
    ? `<button class="btn-accent" onclick="addNegForm()"><svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round">${ICONS.plus}</svg>Nova negociação</button>`

  const pills = filters.map(p=>`<button class="pill${f===p?' active':''}" onclick="setFilter('neg','${p}')">${p}</button>`).join('');

  const rows = list.map(n=>`
    <tr style="cursor:pointer" onclick="viewNegociacao(${n.id})">
      <td><div class="client-name">${esc(n.cliente)}</div><div class="client-email">${esc(n.tipo)}</div></td>
      <td class="text-muted" style="font-size:12px;max-width:160px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${esc(n.imovel)}</td>

        </div>

    </tr>`).join('') || `<tr class="empty-row"><td colspan="7">Nenhuma negociação encontrada.</td></tr>`;

  return `
  ${banner}
  <div class="filter-bar">
    <div class="filter-pills">${pills}</div>

  <div class="table-card">
    <table>

        <tr>
          <th>Cliente</th><th>Imóvel</th>
          ${can.financial?'<th>Valor</th>':''}

/* ═══════════════════════════════════════════════════════
   SECTION ROUTER
═══════════════════════════════════════════════════════ */
function renderSection() {
  const content = document.getElementById('content');
  if(!content) return;
  const s = state.section;
  let html = '';
  if(s==='painel'){
    if(state.role==='Administrador')        html=renderPainelAdmin();
    else if(state.role==='Corretor')        html=renderPainelCorretor();
    else                                     html=renderPainelFuncionario();
  } else if(s==='imoveis')                  html=renderImoveis();
  else if(s==='clientes')                   html=renderClientes();
  else if(s==='atendimentos')               html=renderAtendimentos();
  else if(s==='negociacoes')                html=renderNegociacoes();
  else if(s==='meus_imoveis')               html=renderMeusImoveis();
  else if(s==='meus_agendamentos')          html=renderMeusAgendamentos();
  content.innerHTML = html;
  if(s==='painel') initCharts();
}

/* ═══════════════════════════════════════════════════════
   MAIN RENDER
═══════════════════════════════════════════════════════ */
function render() {
  const app = document.getElementById('app');
  if(!state.loggedIn) {
    app.innerHTML = renderLogin();
  } else {
    app.innerHTML = renderApp();
    renderSection();
  }
}

/* ═══════════════════════════════════════════════════════

═══════════════════════════════════════════════════════ */
function selectRole(r) { state.role = r; render(); }

function doLogin() {
  const meta = ROLE_META[state.role];
  const first = NAV_BY_ROLE[state.role][0].id;
  state.section = first;
  state.loggedIn = true;
  state.filter = {};
  render();
  setTimeout(() => showToast(`Bem-vindo, ${meta.name.split(' ')[0]}!`,'success'), 100);
}

function doLogout() {
  state.loggedIn = false;
  state.role = 'Administrador';
  state.filter = {};
  render();
}

function setSection(s) {
  state.section = s;
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.getAttribute('onclick')===`setSection('${s}')`);
  });
  const titleMap = {painel:"Painel de Controle",imoveis:"Imóveis",clientes:"Clientes",atendimentos:"Atendimentos",negociacoes:"Negociações",meus_imoveis:"Buscar Imóveis",meus_agendamentos:"Meus Agendamentos"};
  const ht = document.getElementById('header-title');
  if(ht) ht.textContent = titleMap[s]||'';
  destroyChart('bar'); destroyChart('pie');
  renderSection();
}
